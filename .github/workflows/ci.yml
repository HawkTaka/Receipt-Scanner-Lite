name: CI Build and Test

on:
  push:
    branches: [ main, develop, 'claude/**' ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION_PATH: 'ReceiptScannerLite.sln'
  PROJECT_PATH: 'src/ReceiptScannerLite/ReceiptScannerLite.csproj'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        clean: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload
      run: |
        dotnet workload install maui --skip-sign-check
        dotnet workload list

    - name: Clean previous builds
      run: dotnet clean ${{ env.PROJECT_PATH }} -c Release

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_PATH }}

    - name: Build Android (verification build)
      run: dotnet build ${{ env.PROJECT_PATH }} -f net8.0-android --configuration Release --no-restore /p:TreatWarningsAsErrors=false

    - name: Run tests (if any)
      run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --verbosity normal
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-android
        path: |
          **/bin/Release/net8.0-android/**
          !**/bin/Release/**/ref/**
          !**/bin/Release/**/*.pdb
        retention-days: 7

  build-android:
    name: Build Android
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        clean: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload
      run: dotnet workload install maui --skip-sign-check

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build Android APK
      run: dotnet build ${{ env.PROJECT_PATH }} -f net8.0-android -c Release /p:AndroidPackageFormat=apk /p:TreatWarningsAsErrors=false

    - name: Upload Android APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: android-apk
        path: |
          **/bin/Release/net8.0-android/**/*.apk
        retention-days: 30

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        clean: true

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_VERSION }}

    - name: Install .NET MAUI workload
      run: dotnet workload install maui --skip-sign-check

    - name: Restore dependencies
      run: dotnet restore ${{ env.SOLUTION_PATH }}

    - name: Build Windows MSIX
      run: dotnet publish ${{ env.PROJECT_PATH }} -f net8.0-windows10.0.19041.0 -c Release -p:RuntimeIdentifierOverride=win10-x64 /p:TreatWarningsAsErrors=false

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: windows-msix
        path: |
          **/bin/Release/net8.0-windows*/**/publish/**
        retention-days: 30
